[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatiomic"]

[project]
name = "spatiomic"
version = "0.11.0"
description = "A python toolbox for spatial omics analysis."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Malte Kuehl", email = "malte.kuehl@clin.au.dk" }]
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Natural Language :: English",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "adjustText",
    "anndata>=0.12",
    "colorcet",
    "esda>=2.7",
    "fastersom==0.5.0",
    "graspologic-native>=1.3.1",
    "joblib",
    "lazy_loader",
    "matplotlib>=3.9",
    "libpysal>=4.12",
    "networkx>=3.7",
    "numpy>=2",
    "pandas>=2.2",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "umap-learn>=0.5.7",
]

[project.urls]
Home = "https://github.com/complextissue/spatiomic"
Source = "https://github.com/complextissue/spatiomic"
Documentation = "https://spatiomic.org"

[tool.ruff]
include = [
    "pyproject.toml",
    "docs/**/*.py",
    "docs/**/*.ipynb",
    "spatiomic/**/*.py",
    "test/**/*.py",
]
cache-dir = "~/.cache/ruff"
exclude = [".venv"]
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "D",
    "I",
    "E4",
    "E7",
    "E9",
    "F",
    "FIX",
    "N",
    "NPY",
    "PD",
    "PERF",
    "RUF",
    "S",
    "SIM",
    "TID",
    "W",
]
ignore = [
    "C901",
    "D417",
    "E402",
    "E203",
    "E731",
    "F841",
    "F811",
    "N811",
    "N813",
    "NPY002",
    "S301",
    "S403",
    "S101",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
pydocstyle.convention = "google"
mccabe.max-complexity = 7
isort.case-sensitive = true
isort.order-by-type = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
python_version = "3.12"
ignore_missing_imports = true
exclude = ["^docs/.*", "^test/.*"]

[tool.pytest.ini_options]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_level = "WARNING"
log_cli = true
addopts = ["--strict-markers"]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "cpu: marks tests that explicitly run the CPU, not the GPU version (deselect with '-m \"not cpu\"')",
    "no_github_ci: marks tests that should not be run on GitHub CI (deselect with '-m \"not no_github_ci\"')",
    "gpu: marks tests that require a GPU (deselect with '-m \"not gpu\"')",
]

[tool.coverage.run]
source = ["spatiomic"]
omit = ["*/test/*", "*/plot/*"]

[tool.coverage.report]
# don't complain if non-runnable code isn't run:
exclude_lines = [
    "if 0:",
    "if __name__ == __main__:",
    "raise",
    "except",
    "@abc.abstractmethod",
    "def __repr__",
    "def __str__",
    "if TYPE_CHECKING:",
    # exclude GPU-only parts
    "if use_gpu:",
    "if self.use_gpu:",
    "if self.cuml:",
    "if cuml",
    "elif cuml:",
]
ignore_errors = true

[tool.coverage.html]
directory = "docs/coverage_report"

[dependency-groups]
test = [
    "aicspylibczi",
    "coverage",
    "opencv-python-headless",
    "pytest>=8",
    "qptifffile",
    "readlif",
]
lint = [
    "bandit>=1.9.4",
    "mypy==2.4.0",
    "pandas-stubs",
    "pre-commit>=4",
    "ruff==0.17.2",
    "scipy-stubs",
]
doc = [
    "furo",
    "ipykernel",
    "ipywidgets",
    "myst-parser",
    "nbsphinx",
    "openpyxl",
    "pandoc",
    "session-info2",
    "sphinx",
    "sphinx-autoapi>=3.8",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-llms-txt>=0.7.1",
    "sphinx-rtd-theme",
    "sphinxcontrib-mermaid",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "doc" },
]

[project.optional-dependencies]
cellpose = ["cellpose>=4.2,<5"]
spatialdata = ["spatialdata>=0.8"]
cuda-12 = [
    "cuml-cu12>=25.10",
    "cugraph-cu12>=25.10",
    "nx-cugraph-cu12>=25.10",
    "cucim-cu12>=25.10",
]
cuda-13 = [
    "cuml-cu13>=25.10",
    "cugraph-cu13>=25.10",
    "nx-cugraph-cu13>=25.10",
    "cucim-cu13>=25.10",
]

[tool.uv]
default-groups = []
extra-index-url = ["https://pypi.nvidia.com"]
index-strategy = "unsafe-best-match"
prerelease = "if-necessary-or-explicit"
conflicts = [[{ extra = "cuda-12" }, { extra = "cuda-13" }]]

[tool.uv.sources]
spatiomic = { workspace = true }
